services:
  agents:
    build: .
    image: plumcodesbybit:latest
    restart: unless-stopped
    env_file: .env
    ports:
      # web UI - por omissao so no host (127.0.0.1). Poe atras de um reverse
      # proxy com TLS se o quiseres expor.
      - "127.0.0.1:8080:8080"
    environment:
      PLUMBYBIT_WEB_HOST: "0.0.0.0"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,os,sys; p=os.getenv('PLUMBYBIT_STATE_DB','data/plumbybit.db'); sys.exit(0 if os.path.exists(p) else 1)"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 3m
